name: Docker Build & Push

on:
  push:
    branches: [ main, index ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, index ]
  workflow_dispatch:

env:
  # 后端镜像名称
  BACKEND_IMAGE: ipinfo-flask
  # 前端镜像名称
  FRONTEND_IMAGE: ipinfo-nginx

jobs:
  build-and-push-backend:
    name: 构建并推送后端镜像到 Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录 Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 提取 Docker 元数据
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 构建并推送后端镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.backend  # 假设后端 Dockerfile 路径
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 后端镜像构建摘要
      if: github.event_name != 'pull_request'
      run: |
        echo "### 🐳 后端 Docker 镜像构建成功" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**镜像标签:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**镜像地址:** \`${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY

  build-and-push-frontend:
    name: 构建并推送前端镜像到 Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录 Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 提取 Docker 元数据
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 构建并推送前端镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.nginx
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 前端镜像构建摘要
      if: github.event_name != 'pull_request'
      run: |
        echo "### 🌐 前端 Nginx Docker 镜像构建成功" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**镜像标签:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta-frontend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**镜像地址:** \`${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY

  # 可选：添加一个组合摘要 job
  summary:
    name: 生成构建摘要
    runs-on: ubuntu-latest
    needs: [build-and-push-backend, build-and-push-frontend]
    if: github.event_name != 'pull_request' && always()

    steps:
    - name: 汇总构建信息
      run: |
        echo "# 📦 Docker 镜像构建汇总" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 构建时间: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| 镜像名称 | 标签 | 状态 |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| \`${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}\` | latest | ✅ 成功 |" >> $GITHUB_STEP_SUMMARY
        echo "| \`${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}\` | latest | ✅ 成功 |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "> 🔗 查看详情: https://hub.docker.com/u/${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_STEP_SUMMARY