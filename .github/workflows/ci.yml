name: CI

on:
  push:
    branches: [ main, index, develop ]
  pull_request:
    branches: [ main, index ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12']

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov

    - name: 代码质量检查
      run: |
        # 停止构建如果有 Python 语法错误或未定义的名称
        flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics
        # 警告但不失败
        flake8 server --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 检查项目结构
      run: |
        echo "检查关键文件是否存在..."
        test -f server/app.py && echo "✓ app.py 存在" || exit 1
        test -f server/requirements.txt && echo "✓ requirements.txt 存在" || exit 1
        test -d dns-compare-tool && echo "✓ 前端目录存在" || exit 1

    - name: 运行测试 (如果存在)
      run: |
        if [ -d "tests" ] || [ -d "server/tests" ]; then
          pytest --cov=server --cov-report=xml --cov-report=term
        else
          echo "⚠️  未找到测试目录，跳过测试"
        fi

  lint-frontend:
    name: 前端代码检查
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 检查 HTML/JS 文件
      run: |
        echo "检查前端文件..."
        test -f dns-compare-tool/index.html && echo "✓ index.html 存在" || exit 1
        
        # 检查基本的 HTML 语法
        if command -v tidy &> /dev/null; then
          tidy -q -e dns-compare-tool/index.html || echo "⚠️  HTML 有警告"
        else
          echo "ℹ️  跳过 HTML 验证 (tidy 未安装)"
        fi
