name: 部署 Flask 应用

on:
  push:
    branches:
      - index
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 Python 环境
      uses: actions/setup-python@v3
      with:
        python-version: 3.9

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安装静态链接依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev zlib1g-dev libbz2-dev \
                                libreadline-dev libsqlite3-dev wget curl llvm \
                                libffi-dev liblzma-dev python3-openssl git

    - name: 下载并安装静态 Python
      run: |
        wget https://www.python.org/ftp/python/3.9.7/Python-3.9.7.tgz
        tar -xzf Python-3.9.7.tgz
        cd Python-3.9.7
        ./configure --enable-shared --enable-static
        make
        sudo make altinstall

    - name: 设置新的 Python 路径
      run: echo "PYTHON_LOCATION=/usr/local/bin/python3.9" >> $GITHUB_ENV  # 正确设置新的 Python 可执行文件路径

    - name: 安装 PyInstaller
      run: ${{ env.PYTHON_LOCATION }} -m pip install pyinstaller

    - name: 打包 Flask 应用
      run: |
        cd $GITHUB_WORKSPACE/server
        ${{ env.PYTHON_LOCATION }} -m PyInstaller -F --add-binary '/usr/local/lib/python3.9/config-3.9m-x86_64-linux-gnu/libpython3.9.a:.' \
        --hidden-import flask_cors --hidden-import requests --hidden-import dns.resolver --hidden-import country_mapping app.py
        ls -la dist

    - name: 检查可执行文件是否存在
      run: |
        if [ -f "$GITHUB_WORKSPACE/server/dist/app" ]; then
          echo "可执行文件存在，继续上传。"
        else
          echo "可执行文件不存在，请检查。"
          exit 1
        fi

    - name: 获取当前版本号
      id: get_version
      run: |
        current_version=$(git tag | grep version_ | sort -V | tail -n 1)
        if [ -z "$current_version" ]; then
          current_version="version_0.0"
        fi
        version_prefix=${current_version%.*}
        version_suffix=${current_version#*.}
        new_version_suffix=$((version_suffix + 1))
        new_version="$version_prefix.$new_version_suffix"
        echo "new_version=$new_version" >> $GITHUB_ENV

    - name: 检查是否已经存在 Release
      id: check_release
      run: |
        if git tag | grep -q "${{ env.new_version }}"; then
          echo "Release ${{ env.new_version }} 已存在."
          echo "skip_release=true" >> $GITHUB_ENV
        else
          echo "skip_release=false" >> $GITHUB_ENV
        fi

    - name: 创建 Release
      if: env.skip_release == 'false'
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ env.new_version }}
        release_name: ${{ env.new_version }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 验证 dist 目录
      run: |
        echo "当前路径: $GITHUB_WORKSPACE/server/dist"
        ls -la $GITHUB_WORKSPACE/server/dist/

    - name: 设置当前日期时间
      id: datetime
      run: echo "current_datetime=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

    - name: 上传打包容件到 Release
      if: env.skip_release == 'false'
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}/server/dist/app
        asset_name: app_${{ env.current_datetime }}
        asset_content_type: application/octet-stream
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 上传打包文件为 artifact
      uses: actions/upload-artifact@v3
      with:
        name: ipinfo-flask-app_${{ env.current_datetime }}
        path: ${{ github.workspace }}/server/dist/app
