name: 部署 Flask 应用

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Python 环境
      uses: actions/setup-python@v3
      with:
        python-version: 3.9

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安装 PyInstaller
      run: pip install pyinstaller

    - name: 打包 Flask 应用
      run: |
        cd $GITHUB_WORKSPACE/server
        pyinstaller -F --hidden-import flask_cors --hidden-import requests --hidden-import dns.resolver --hidden-import country_mapping app.py
        ls -la dist

    - name: 检查可执行文件是否存在
      run: |
        if [ -f "$GITHUB_WORKSPACE/server/dist/app" ]; then
          echo "可执行文件存在，继续上传。"
        else
          echo "可执行文件不存在，请检查。"
          exit 1
        fi

    - name: 创建 Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: release-${{ github.sha }}
        release_name: Release ${{ github.sha }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 验证 dist 目录
      run: |
        echo "当前路径: $GITHUB_WORKSPACE/server/dist"
        ls -la $GITHUB_WORKSPACE/server/dist/

    - name: 上传打包容件到 Release
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}/server/dist/app  # 使用环境变量
        asset_name: app
        asset_content_type: application/octet-stream
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 上传打包文件为 artifact
      uses: actions/upload-artifact@v3
      with:
        name: ipinfo-flask-app
        path: ${{ github.workspace }}/server/dist/app
