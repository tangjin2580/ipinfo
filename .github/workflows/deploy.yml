name: 部署 Flask 应用

on:
  push:
    branches:
      - index  # 当 index 分支有新的推送时触发工作流
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 设置权限，允许写入内容，例如创建 Release

    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      
    - name: 设置 Python 环境
      uses: actions/setup-python@v3
      with:
        python-version: 3.9  # 指定 Python 版本为 3.9

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安装 PyInstaller
      run: pip install pyinstaller

    - name: 打包 Flask 应用
      run: |
        cd $GITHUB_WORKSPACE/server  # 确保在包含 app.py 的目录下
        # 获取 Python 安装路径
        python_path=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
        # 使用正确的 libpython3.9.a 路径
        pyinstaller -F --add-binary "$python_path/libpython3.9.a:." \
          --hidden-import flask_cors --hidden-import requests --hidden-import dns.resolver --hidden-import country_mapping app.py
        ls -la dist  # 列出 dist 目录中的文件以确认生成的文件
      shell: /usr/bin/bash -e {0}
      env:
        PYTHON_LOCATION: /usr/local/bin/python3.9

    - name: 检查可执行文件是否存在
      run: |
        if [ -f "$GITHUB_WORKSPACE/server/dist/app" ]; then
          echo "可执行文件存在，继续上传。"
        else
          echo "可执行文件不存在，请检查。"
          exit 1
        fi

    - name: 获取当前版本号
      id: get_version
      run: |
        current_version=$(git tag | grep version_ | sort -V | tail -n 1)  # 获取最新的版本号
        if [ -z "$current_version" ]; then
          current_version="version_0.0"  # 如果没有版本则初始化为 version_0.0
        fi
        # 增加小版本号
        version_prefix=${current_version%.*}
        version_suffix=${current_version#*.}
        new_version_suffix=$((version_suffix + 1))
        new_version="$version_prefix.$new_version_suffix"
        echo "new_version=$new_version" >> $GITHUB_ENV  # 将新版本号写入环境变量
      shell: /usr/bin/bash -e {0}

    - name: 检查是否已经存在 Release
      id: check_release
      run: |
        if git tag | grep -q "${{ env.new_version }}"; then
          echo "Release ${{ env.new_version }} 已存在."
          echo "skip_release=true" >> $GITHUB_ENV
        else
          echo "skip_release=false" >> $GITHUB_ENV
        fi

    - name: 创建 Release
      if: env.skip_release == 'false'
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ env.new_version }}  # 使用新版本号
        release_name: ${{ env.new_version }}  # 使用新版本号
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 使用 GITHUB_TOKEN 进行身份验证

    - name: 验证 dist 目录
      run: |
        echo "当前路径: $GITHUB_WORKSPACE/server/dist"
        ls -la $GITHUB_WORKSPACE/server/dist/

    - name: 设置当前日期时间
      id: datetime
      run: echo "current_datetime=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV  # 设置当前时间到环境变量

    - name: 上传打包容件到 Release
      if: env.skip_release == 'false'
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}/server/dist/app  # 使用环境变量
        asset_name: app_${{ env.current_datetime }}  # 将时间戳作为文件名的一部分
        asset_content_type: application/octet-stream  # 设置文件内容类型
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 使用 GITHUB_TOKEN 进行身份验证

    - name: 上传打包文件为 artifact
      uses: actions/upload-artifact@v3
      with:
        name: ipinfo-flask-app_${{ env.current_datetime }}  # 将时间戳加入到 artifact 名称
        path: ${{ github.workspace }}/server/dist/app
