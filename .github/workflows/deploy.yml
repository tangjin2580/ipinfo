name: 部署 Flask 应用

on:
  push:
    branches:
      - index  # 当 index 分支有新的推送时触发工作流
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 设置权限，允许写入内容，例如创建 Release

    steps:
      # 检出代码
      - name: 检出代码
        uses: actions/checkout@v3

      # 设置 Python 环境
      - name: 设置 Python 环境
        uses: actions/setup-python@v3
        with:
          python-version: 3.9  # 指定 Python 版本为 3.9

      # 安装依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 安装测试依赖
      - name: 安装测试依赖
        run: |
          python -m pip install pytest

      # 验证 Python 路径
      - name: 验证 Python 路径
        run: |
          python --version
          which python

      # 打包 Flask 应用
      - name: 打包 Flask 应用
        run: |
          cd $GITHUB_WORKSPACE/server  # 确保在包含 app.py 的目录下
          pyinstaller -F --hidden-import flask_cors --hidden-import requests --hidden-import dns.resolver --hidden-import country_mapping app.py
          ls -la dist  # 列出 dist 目录中的文件以确认生成的文件

      # 检查可执行文件是否存在
      - name: 检查可执行文件
        run: |
          if [ -f "$GITHUB_WORKSPACE/server/dist/app" ]; then
            echo "可执行文件存在，继续上传。"
          else
            echo "可执行文件不存在，请检查。"
            exit 1
          fi

      # 获取当前版本号
      - name: 获取当前版本号
        id: get_version
        run: |
          current_version=$(git tag | grep '^v[0-9]*\.[0-9]*' | sort -V | tail -n 1 || echo "v0.0.0")
          version_prefix=${current_version%.*}
          version_suffix=${current_version##*.}
          new_version_suffix=$((version_suffix + 1))
          new_version="${version_prefix}.${new_version_suffix}"
          echo "new_version=$new_version" >> $GITHUB_ENV
          echo "生成的新版本号: $new_version"

      # 检查是否已经存在 Release
      - name: 检查是否已存在 Release
        id: check_release
        run: |
          if git tag | grep -q "${{ env.new_version }}"; then
            echo "Release ${{ env.new_version }} 已存在."
            echo "skip_release=true" >> $GITHUB_ENV
          else
            echo "skip_release=false" >> $GITHUB_ENV
          fi

      # 创建 Release
      - name: 创建 Release
        if: env.skip_release == 'false'
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.new_version }}
          release_name: ${{ env.new_version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上传打包文件到 Release
      - name: 上传打包文件到 Release
        if: env.skip_release == 'false'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/server/dist/app
          asset_name: app_${{ env.new_version }}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上传打包文件为 artifact
      - name: 上传打包文件为 artifact
        uses: actions/upload-artifact@v3
        with:
          name: flask-app_${{ env.new_version }}
          path: ${{ github.workspace }}/server/dist/app

      # 运行单元测试
      - name: 运行单元测试
        run: |
          cd $GITHUB_WORKSPACE
          pytest tests
